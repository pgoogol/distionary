spring:
  application:
    name: distionary-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/distionary}
    username: ${DB_USERNAME:distionary}
    password: ${DB_PASSWORD:distionary}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
