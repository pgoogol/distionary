services:
  postgres:
    image: postgres:17-alpine
    container_name: distionary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: distionary
      POSTGRES_USER: distionary
      POSTGRES_PASSWORD: distionary
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distionary -d distionary"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
